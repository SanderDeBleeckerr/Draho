# Builds the game for the web and publishes it on GitHub Pages,
# so it can be played in Safari on an iPhone. See docs/PHONE_WORKFLOW.md.
# The game stays at the site root. The static pages in site/ (for example the funding page)
# are added next to it, at /Draho/funding/. funding-page.yml updates only those pages.
name: Web build (play on phone)

on:
  push:
    branches: [main]
    paths: ["Draho/**", ".github/workflows/web-build.yml"]
  # site/** is not here: funding-page.yml publishes those changes without a Unity build.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # With a .ulf license file we use the standard GameCI action. Without one, we activate
      # the Personal license inside the container with email + password (experimental).
      HAS_ULF: ${{ secrets.UNITY_LICENSE != '' }}
    steps:
      - name: Check Unity secrets
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Add the repository secrets UNITY_EMAIL and UNITY_PASSWORD. See docs/PHONE_WORKFLOW.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Draho/Library
          key: Library-WebGL-${{ hashFiles('Draho/Assets/**', 'Draho/Packages/**', 'Draho/ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      - name: Build WebGL (license file)
        if: env.HAS_ULF == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Draho
          unityVersion: 6000.3.26f1
          targetPlatform: WebGL
          buildMethod: Draho.EditorTools.CiBuild.BuildWebGL
          allowDirtyBuild: true

      - name: Build WebGL (email + password, no license file)
        if: env.HAS_ULF != 'true'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          docker run --rm \
            -e UNITY_EMAIL -e UNITY_PASSWORD -e WORKSPACE=/github/workspace \
            -v "$GITHUB_WORKSPACE:/github/workspace" -w /github/workspace \
            unityci/editor:ubuntu-6000.3.26f1-webgl-3 \
            bash .github/scripts/unity-personal-build.sh
          sudo chown -R "$(id -u):$(id -g)" build Draho/Library

      - name: Check build output
        run: test -f build/WebGL/WebGL/index.html || { echo "::error::No index.html in build/WebGL/WebGL"; ls -R build | head -50; exit 1; }

      - name: Stamp the build with the commit (Tools/Playtest waits for it)
        run: echo "$GITHUB_SHA" | sudo tee build/WebGL/WebGL/version.txt

      # The game alone, so funding-page.yml can publish site/ changes without a new Unity build.
      - uses: actions/upload-artifact@v4
        with:
          name: webgl-game
          path: build/WebGL/WebGL
          retention-days: 90

      - name: Add the static pages (site/) next to the game
        run: sudo cp -r site/. build/WebGL/WebGL/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
