# Collects reference pictures for art reviews (black cat photos from Wikimedia Commons, previews of
# well-liked cat models on Sketchfab) and pushes them to the temporary branch "reference-images".
# They are for looking only; they are not used in the game. Delete the branch after the review.
name: Reference images

on:
  push:
    branches: [main]
    paths: [".github/workflows/reference-images.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMMONS_QUERIES: "black cat face|black cat portrait yellow eyes|black cat head close-up"
      SKETCHFAB_QUERIES: "low poly cat|stylized cat head|black cat"
    steps:
      - name: Collect
        run: |
          mkdir -p ref && cd ref
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          UA = {"User-Agent": "DrahoReference/1.0 (github.com/SanderDeBleeckerr/Draho)"}
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30).read()
          lines = ["# Reference images (temporary, for review only)", ""]
          n = 0
          for q in os.environ["COMMONS_QUERIES"].split("|"):
              api = ("https://commons.wikimedia.org/w/api.php?action=query&format=json&generator=search"
                     f"&gsrnamespace=6&gsrlimit=6&gsrsearch={urllib.parse.quote(q)}"
                     "&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=640")
              pages = json.loads(get(api)).get("query", {}).get("pages", {})
              for p in pages.values():
                  info = p["imageinfo"][0]
                  if not info.get("thumburl", "").lower().endswith((".jpg", ".jpeg", ".png")):
                      continue
                  n += 1
                  name = f"photo_{n:02d}.jpg"
                  open(name, "wb").write(get(info["thumburl"]))
                  meta = info.get("extmetadata", {})
                  lic = meta.get("LicenseShortName", {}).get("value", "?")
                  artist = re.sub("<[^>]+>", "", meta.get("Artist", {}).get("value", "?"))[:60]
                  lines.append(f"- {name}: {p['title']} — {artist} — {lic} — {info['descriptionurl']}")
          for q in os.environ["SKETCHFAB_QUERIES"].split("|"):
              api = ("https://api.sketchfab.com/v3/search?type=models&count=8&sort_by=-likeCount"
                     f"&q={urllib.parse.quote(q)}")
              for m in json.loads(get(api)).get("results", []):
                  imgs = sorted(m.get("thumbnails", {}).get("images", []), key=lambda i: abs(i["width"] - 640))
                  if not imgs:
                      continue
                  n += 1
                  name = f"model_{n:02d}.jpg"
                  open(name, "wb").write(get(imgs[0]["url"]))
                  lines.append(f"- {name}: \"{m['name']}\" by @{m['user']['username']} — {m['viewerUrl']}")
          open("SOURCES.md", "w").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
      - name: Push to the reference-images branch
        run: |
          cd ref
          git init -q -b reference-images
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Reference images for review (temporary)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" reference-images
