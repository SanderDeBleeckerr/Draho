<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121214">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; height: 100%; background: #121214; overflow: hidden; touch-action: none;
        -webkit-user-select: none; user-select: none; font-family: -apple-system, system-ui, sans-serif; }
      #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #121214; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; color: #f2e6cf; background: radial-gradient(circle at 50% 40%, #2a2622, #121214 70%); }
      #loading h1 { font-weight: 600; letter-spacing: 0.08em; margin: 0 0 4px; font-size: 34px; }
      #loading p { margin: 0 0 22px; opacity: 0.7; font-size: 15px; }
      #bar { width: min(60vw, 320px); height: 6px; border-radius: 3px; background: #3a342d; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #f0b24a; transition: width 0.2s; }
      #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
        background: #121214ee; color: #f2e6cf; font-size: 20px; padding: 24px; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
      #error { position: fixed; left: 0; right: 0; bottom: 0; background: #a33; color: #fff; padding: 10px; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>DRAHOMIL</h1>
      <p>a black cat with a job</p>
      <div id="bar"><div id="fill"></div></div>
    </div>
    <div id="rotate">Turn your phone sideways to play.</div>
    <div id="error"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        // Phones have 3x screens; 2x is sharp enough and much faster.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (msg, type) {
          if (type !== "error") { console.warn(msg); return; }
          var e = document.querySelector("#error"); e.textContent = msg; e.style.display = "block";
        },
      };
      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = (100 * progress) + "%";
        }).then(function (instance) {
          window.unityInstance = instance; // used by Tools/Playtest
          document.querySelector("#loading").style.display = "none";
        }).catch(function (message) { config.showBanner(String(message), "error"); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
