# Downloads third-party art (Kenney packs, Sketchfab models) and commits it to the
# branch you run it on. Start it from the GitHub app: Actions -> Fetch assets -> Run workflow.
name: Fetch assets

on:
  # Also runs when this workflow or its script changes on main (Claude cannot press "Run workflow").
  push:
    branches: [main]
    paths: [".github/workflows/fetch-assets.yml", ".github/scripts/fetch-assets.sh"]
  workflow_dispatch:
    inputs:
      kenney_packs:
        description: "Kenney pack slugs (space-separated)"
        default: "furniture-kit"
      sketchfab_models:
        description: "Sketchfab models as folder=uid (space-separated)"
        default: "lowpoly-cat=c36df576c9ae4ed28e89069b1a2f427a sliding-door=a699c070dc864bdd89e9f3accc1f0c0e"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Kenney packs
        env:
          KENNEY_PACKS: ${{ inputs.kenney_packs || 'furniture-kit' }}
        run: bash .github/scripts/fetch-assets.sh

      - name: Sketchfab models
        # Kenney files are still committed when this step fails (no token, bad license, ...).
        continue-on-error: true
        env:
          SKETCHFAB_MODELS: ${{ inputs.sketchfab_models || 'lowpoly-cat=c36df576c9ae4ed28e89069b1a2f427a sliding-door=a699c070dc864bdd89e9f3accc1f0c0e' }}
          SKETCHFAB_API_TOKEN: ${{ secrets.SKETCHFAB_API_TOKEN }}
        run: bash .github/scripts/fetch-assets.sh

      - name: Commit
        run: |
          git add -A Draho/Assets/_Draho/ThirdParty ThirdParty
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fetch third-party assets" -m "Kenney: ${{ inputs.kenney_packs || 'furniture-kit' }}" -m "Sketchfab: ${{ inputs.sketchfab_models || 'lowpoly-cat=c36df576c9ae4ed28e89069b1a2f427a sliding-door=a699c070dc864bdd89e9f3accc1f0c0e' }}"
          git push
          git show --stat HEAD | tail -30
