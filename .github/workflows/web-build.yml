# Builds the game for the web and publishes it on GitHub Pages,
# so it can be played in Safari on an iPhone. See docs/PHONE_WORKFLOW.md.
name: Web build (play on phone)

on:
  push:
    branches: [main]
    paths: ["Draho/**", ".github/workflows/web-build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check Unity secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/PHONE_WORKFLOW.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Draho/Library
          key: Library-WebGL-${{ hashFiles('Draho/Assets/**', 'Draho/Packages/**', 'Draho/ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Draho
          unityVersion: 6000.3.26f1
          targetPlatform: WebGL
          buildMethod: Draho.EditorTools.CiBuild.BuildWebGL
          allowDirtyBuild: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
